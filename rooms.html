<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Phòng Khách Sạn</title>
    <link rel="stylesheet" href="rooms.css">
</head>
<body>
    <header>
        <h1>Danh Sách Phòng Khách Sạn</h1>
    </header>

    <div class="container">
        <!-- 1. BỘ LỌC TÌM KIẾM BÊN TRÁI -->
        <aside class="sidebar">
            <h3>Bộ lọc tìm kiếm</h3>
            <div class="filter-group">
                <label>Loại phòng:</label><br>
                <input type="checkbox" id="deluxe" value="Deluxe"> Deluxe<br>
                <input type="checkbox" id="standard" value="Standard"> Standard<br>
                <input type="checkbox" id="vip" value="VIP"> VIP
            </div>
            <div class="filter-group">
                <label>Khoảng giá tối đa (VNĐ):</label>
                <input type="number" id="maxPrice" placeholder="Ví dụ: 2000000">
            </div>
            <button class="btn-filter" onclick="filterRooms()">Áp dụng lọc</button>
        </aside>

        <!-- 2. DANH SÁCH PHÒNG BÊN PHẢI -->
        <main class="room-grid" id="roomContainer">
            <!-- Dữ liệu phòng từ JS sẽ tự động đổ vào đây -->
        </main>
    </div>

    <script src="rooms.js"></script>
</body>
</html>
